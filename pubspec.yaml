name: connectcall
description: "Connect Call - Connect with anyone, anywhere. 1-to-1 audio/video calling."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / Auth / DB
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0

  # State management (ONLY provider per spec)
  provider: ^6.1.2

  # Theme persistence
  shared_preferences: ^2.3.2

  # Calling SDK (Zego) — keep prebuilt + signaling on a mutually
  # compatible set (prebuilt 4.24.x pairs with signaling 2.8.20+).
  zego_uikit: ^2.29.0
  zego_uikit_prebuilt_call: ^4.24.0
  zego_uikit_signaling_plugin: ^2.7.0

  # Permissions / utils
  permission_handler: ^12.0.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
